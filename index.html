<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث التطبيق</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .btn {
            display: inline-block;
            padding: 15px 25px;
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>تحديث التطبيق مطلوب</h1>
    <p>يرجى تحديث التطبيق للحصول على أحدث المزايا.</p>
    <a href="#" class="btn" id="updateButton">تحديث الآن</a>

    <script>
        document.getElementById('updateButton').addEventListener('click', function () {
            // رابط جوجل بلاي
            const playStoreUrl = "https://play.google.com/store/apps/details?id=com.asheeq.webviewgold";

            // التوجيه إلى الرابط مباشرة
            window.open(playStoreUrl, '_blank'); // هذا سيفتح الرابط في المتصفح أو تطبيق جوجل بلاي
        });
    </script>
</body>
</html>
