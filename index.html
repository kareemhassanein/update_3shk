<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث التطبيق</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>يرجى تحديث التطبيق</h1>
        <p>اضغط على الزر أدناه لتحديث التطبيق إلى أحدث إصدار.</p>
        <a class="btn" id="updateButton" href="#">تحديث الآن</a>
    </div>
    <script>
        document.getElementById('updateButton').addEventListener('click', function() {
            // محاولة فتح التطبيق مباشرة
            const marketUrl = "market://details?id=com.asheeq.webviewgold";
            const webFallbackUrl = "https://play.google.com/store/apps/details?id=com.asheeq.webviewgold";

            // توجيه عبر market:// أولاً
            try {
                window.location.href = marketUrl;
            } catch (e) {
                // في حالة الفشل، التوجيه إلى صفحة الويب
                window.location.href = webFallbackUrl;
            }
        });
    </script>
</body>
</html>
